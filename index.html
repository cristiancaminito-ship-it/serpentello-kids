<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serpentello Kids 🐍</title><link rel="stylesheet" href="style.css"></head><body><main><header><span>🐍</span><div><h1>Serpentello Kids</h1><p>Osserva come si muove il nostro simpatico serpente!</p></div></header><section><div class="bar"><strong>🍎 Mele: <span id="score">0</span></strong><label>🐢 Velocità <select id="speed"><option value="350">Lenta</option><option value="220" selected>Normale</option><option value="120">Veloce</option></select></label></div><canvas id="game" width="480" height="480" aria-label="Prato con serpente"></canvas><p id="message" role="status">Scegli come iniziare!</p><div class="actions"><button id="demo">✨ Guarda il serpente</button><button id="play">🎮 Gioca tu</button><button id="pause">⏸ Pausa</button><button id="reset">🔄 Ricomincia</button></div><div class="arrows"><button data-dir="up" aria-label="Su">⬆️</button><div><button data-dir="left" aria-label="Sinistra">⬅️</button><button data-dir="down" aria-label="Giù">⬇️</button><button data-dir="right" aria-label="Destra">➡️</button></div></div><small>💡 In modalità dimostrazione il serpente cerca le mele da solo. Per giocare usa le frecce della tastiera o i pulsanti.</small></section></main><script src="app.js"></script></body></html>
